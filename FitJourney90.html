<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF7F5">
<title>fitjourney 90</title>
<style>
:root{--bg:#FAF7F5;--card:#fff;--card2:#F7F3F1;--cream:#FFF0EE;--pink:#F5B8B5;--pd:#C96E6A;--pl:#FDECEA;--pm:#F9D5D3;--sage:#79B89A;--amber:#C8893A;--text:#1E1717;--t2:#8C7C7A;--t3:#BEB0AE;--bdr:#EDE6E3;--sh:0 2px 16px rgba(30,20,18,.07);--r:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:430px;margin:0 auto;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
#setup{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;overflow-y:auto}
.s-logo{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);margin-bottom:24px}
.s-hero{width:68px;height:68px;background:var(--pm);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px}
.s-title{font-size:26px;font-weight:700;text-align:center;margin-bottom:6px;letter-spacing:-.02em}
.s-sub{font-size:14px;color:var(--t2);text-align:center;line-height:1.6;margin-bottom:28px}
.s-label{font-size:11px;color:var(--t2);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;display:block}
.s-input{width:100%;background:var(--card);border:1.5px solid var(--bdr);border-radius:10px;padding:13px 16px;color:var(--text);font-size:16px;font-weight:500;outline:none;-webkit-appearance:none;margin-bottom:14px;transition:border-color .2s;font-family:inherit}
.s-input:focus{border-color:var(--pd)}
.cta{width:100%;background:var(--pd);color:#fff;border:none;border-radius:100px;padding:15px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;font-family:inherit;letter-spacing:.01em}
.cta:active{opacity:.8}
#app{display:none;flex-direction:column;height:100%;overflow:hidden}
.hdr{background:var(--card);padding:52px 20px 14px;flex-shrink:0;border-bottom:1px solid var(--bdr)}
.hdr-brand{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hdr-name{font-size:19px;font-weight:700;letter-spacing:-.02em}
.day-pill{background:var(--pl);border:1px solid var(--pm);color:var(--pd);padding:4px 12px;border-radius:100px;font-size:12px;font-weight:600}
.ph-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ph-chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px}
.ph1{background:#FFF8E6;color:#A87820;border:1px solid #F5E4B0}
.ph2{background:var(--pl);color:var(--pd);border:1px solid var(--pm)}
.ph3{background:#FDECEA;color:#B85652;border:1px solid #F9CECE}
.hd{font-size:12px;color:var(--t3)}
.pb-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-bottom:4px}
.pb{height:4px;background:var(--bdr);border-radius:2px;overflow:hidden}
.pbf{height:100%;background:var(--pink);border-radius:2px;transition:width .6s}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--bdr);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 2px;gap:2px;border:none;background:none;color:var(--t3);font-size:9px;font-weight:600;cursor:pointer;transition:color .2s;letter-spacing:.03em;text-transform:uppercase;font-family:inherit}
.nb.active{color:var(--pd)}
.nb svg{width:20px;height:20px;stroke-width:1.7}
.nd{width:4px;height:4px;border-radius:50%;background:var(--pink);display:none;margin-top:-1px}
.nb.active .nd{display:block}
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:18px 16px 96px;display:none;animation:fu .2s ease}
.page.active{display:block}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bdr)}
.chd{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{background:var(--card);border-radius:var(--r);padding:14px 12px;box-shadow:0 1px 6px rgba(30,20,18,.05);border:1px solid var(--bdr);text-align:center}
.sn{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1}
.sl{font-size:11px;color:var(--t2);margin-top:4px}
.mr{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--bdr);cursor:pointer}
.mr:last-child{border-bottom:none}
.mr:active{opacity:.7}
.mc{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;transition:all .18s;font-size:11px;color:transparent}
.mr.done .mc{background:var(--sage);border-color:var(--sage);color:#fff}
.mb{flex:1;min-width:0}
.mt{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.mn{font-size:15px;font-weight:600;margin-bottom:3px;letter-spacing:-.01em}
.md{font-size:12px;color:var(--t2);line-height:1.4}
.mright{text-align:right;flex-shrink:0}
.mcal{font-size:17px;font-weight:700;letter-spacing:-.02em}
.mcall{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em}
.macros{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.mac{background:var(--card2);border-radius:5px;padding:2px 7px;font-size:11px;color:var(--t2)}
.mac b{color:var(--text)}
.cbw{margin-bottom:4px}
.cbig{font-size:30px;font-weight:700;letter-spacing:-.03em}
.csub{font-size:12px;color:var(--t2);margin-bottom:8px}
.cbar{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden}
.cbf{height:100%;border-radius:3px;transition:width .4s;background:var(--pink)}
.cbf.over{background:var(--amber)}
.wkh{border-radius:var(--r);padding:16px;margin-bottom:12px;background:var(--pl);border:1px solid var(--pm)}
.wkt{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:7px}
.wkm{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.wtag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px}
.wtype{background:#fff;color:var(--pd);border:1px solid var(--pm)}
.wdur{background:#E8F5EF;color:#3D8B6E;border:1px solid #C0E4D6}
.wcrd{background:#FFF6E6;color:var(--amber);border:1px solid #F5DEB0}
.er{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--bdr);cursor:pointer}
.er:last-child{border-bottom:none}
.er:active{opacity:.7}
.eb{width:23px;height:23px;border-radius:7px;border:1.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .18s;font-size:11px;color:transparent}
.er.done .eb{background:var(--sage);border-color:var(--sage);color:#fff}
.en{font-size:15px;font-weight:600;margin-bottom:2px;letter-spacing:-.01em}
.ed{font-size:12px;color:var(--pd);font-weight:600}
.en2{font-size:12px;color:var(--t2);margin-top:2px;line-height:1.4}
.tip{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(30,20,18,.05);border-left:3px solid var(--amber);border-right:1px solid var(--bdr);border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr)}
.tiphd{font-size:10px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.tipb{font-size:13px;color:var(--t2);line-height:1.55}
/* gallon tracker */
.gal-wrap{margin-top:10px}
.gal-bar{height:20px;background:var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:8px;position:relative}
.gal-fill{height:100%;background:linear-gradient(90deg,#93C5FD,#60A5FA);border-radius:10px;transition:width .4s}
.gal-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1E4080;letter-spacing:.02em}
.gal-cups{display:flex;gap:6px;flex-wrap:wrap}
.gcup{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;background:var(--bg);transition:all .18s;filter:grayscale(1) opacity(.35)}
.gcup.full{border-color:#93C5FD;background:#EFF8FF;filter:none}
/* recipe */
.recipe-btn{font-size:12px;color:var(--pd);font-weight:600;background:none;border:none;cursor:pointer;padding:4px 0 0;font-family:inherit;letter-spacing:.01em}
.recipe-box{display:none;background:var(--card2);border-radius:10px;padding:12px;margin-top:8px;font-size:12px;color:var(--t2);line-height:1.6}
.recipe-box ol{padding-left:16px}
.recipe-box li{margin-bottom:4px}
/* weight */
.wr{display:flex;gap:10px;margin-bottom:10px}
.wi{flex:1;background:var(--card2);border:1.5px solid var(--bdr);border-radius:10px;padding:12px 14px;color:var(--text);font-size:17px;font-weight:600;outline:none;-webkit-appearance:none;font-family:inherit;transition:border-color .2s}
.wi:focus{border-color:var(--pd)}
.wb{background:var(--text);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
/* wlog */
.wlr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.wlr:last-child{border-bottom:none}
.wlw{font-size:16px;font-weight:700;letter-spacing:-.02em}
.down{color:var(--sage);font-weight:600}
.up{color:#C85050;font-weight:600}
/* chart */
#wtc{width:100%;height:170px;display:block}
/* toggle */
.vtog{display:flex;background:var(--card2);border-radius:100px;padding:4px;margin-bottom:16px;border:1px solid var(--bdr)}
.vtb{flex:1;padding:8px;border:none;background:none;color:var(--t2);font-size:12px;font-weight:600;border-radius:100px;cursor:pointer;transition:all .2s;font-family:inherit}
.vtb.active{background:var(--card);color:var(--text);box-shadow:0 1px 6px rgba(30,20,18,.05)}
/* day nav */
.dnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.dnb{width:34px;height:34px;background:var(--card);border:1px solid var(--bdr);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--t2);cursor:pointer}
/* shop */
.sh-grp{background:var(--card);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:0 1px 6px rgba(30,20,18,.05);border:1px solid var(--bdr)}
.sh-cat{padding:12px 14px 8px;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center}
.sh-cnt{font-size:11px;background:var(--card2);color:var(--t2);padding:2px 8px;border-radius:100px;text-transform:none;letter-spacing:0}
.shi{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bdr);cursor:pointer}
.shi:last-child{border-bottom:none}
.shi:active{background:var(--card2)}
.shck{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s;font-size:11px;color:transparent}
.shi.bought .shck{background:var(--sage);border-color:var(--sage);color:#fff}
.shi.bought .shn{text-decoration:line-through;color:var(--t3)}
.shn{font-size:14px;font-weight:500;flex:1;color:var(--text)}
.shn2{font-size:11px;color:var(--t2)}
/* cal grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dh{font-size:10px;font-weight:700;color:var(--t3);text-align:center;padding:3px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-d{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--t2);border:1.5px solid transparent;transition:all .15s}
.cal-d.td{border-color:var(--pd);color:var(--pd);background:var(--pl)}
.cal-d.done-d{background:#E8F5EF;color:#3D8B6E;border-color:#C0E4D6}
.cal-d.miss-d{background:#FEF2F2;color:#C85050}
.cal-d.fut-d{opacity:.3}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(30,23,23,.4);z-index:500;display:none;align-items:flex-end;backdrop-filter:blur(6px)}
.mbg.open{display:flex}
.msh{background:var(--card);border-radius:22px 22px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;position:relative}
.mhandle{width:36px;height:3.5px;background:var(--bdr);border-radius:2px;margin:0 auto 18px;display:block}
.mclose{position:absolute;right:18px;top:18px;background:var(--card2);border:1px solid var(--bdr);color:var(--t2);width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#notif{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;padding:10px 22px;border-radius:100px;font-size:13px;font-weight:600;z-index:1000;opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;font-family:inherit}
#notif.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* wellness */
.wcard{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--bdr);box-shadow:var(--sh)}
.wsec{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.wdesc{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:12px}
.wtip-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.wtip-list li{font-size:13px;color:var(--t2);line-height:1.5;padding-left:16px;position:relative}
.wtip-list li::before{content:"·";position:absolute;left:4px;color:var(--pink)}
/* breathing */
.breath-orb{width:130px;height:130px;border-radius:50%;background:var(--pl);border:2px solid var(--pm);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:16px auto;transition:transform 1.2s ease,background .6s,box-shadow 1s;cursor:pointer}
.breath-orb.inh{transform:scale(1.38);background:var(--pm);box-shadow:0 0 32px rgba(245,184,181,.45)}
.breath-orb.exh{transform:scale(.82)}
.bph{font-size:14px;font-weight:700;color:var(--pd);letter-spacing:-.01em}
.bcnt{font-size:30px;font-weight:800;color:var(--text);letter-spacing:-.04em;line-height:1.1}
.brtype-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.brt{font-size:11px;font-weight:600;padding:6px 12px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--card2);color:var(--t2);cursor:pointer;font-family:inherit;transition:all .2s}
.brt.sel{border-color:var(--pd);background:var(--pl);color:var(--pd)}
/* mood */
.mood-row{display:flex;gap:8px;margin-top:10px}
.mood-btn{flex:1;border:1.5px solid var(--bdr);background:var(--card2);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:all .2s;font-family:inherit}
.mood-btn.sel{border-color:var(--pink);background:var(--pl)}
.mej{font-size:22px;display:block;margin-bottom:2px}
.mla{font-size:9px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
/* affirmation */
.affirm{background:linear-gradient(135deg,var(--pl),#fff);border-radius:var(--r);padding:18px;margin-bottom:12px;border:1px solid var(--pm);text-align:center}
.affirm-q{font-size:11px;font-weight:600;color:var(--pd);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.affirm-t{font-size:15px;color:var(--text);line-height:1.6;font-weight:500;letter-spacing:-.01em}
/* rest */
.rcard{text-align:center;padding:28px 16px}
.rcircle{width:66px;height:66px;background:var(--pl);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
/* install */
.inst{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(30,20,18,.05)}
.inst h3{font-size:13px;font-weight:700;margin-bottom:6px}
.inst p{font-size:12px;color:var(--t2);line-height:1.55}
.sec-title{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
.pbdr{height:1px;background:var(--bdr);margin:14px 0}
.bann{background:var(--pl);border:1px solid var(--pm);border-radius:var(--r);padding:13px;margin-bottom:12px;font-size:13px;color:var(--t2);line-height:1.5}
.bann b{color:var(--text)}
.ph-card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:9px;box-shadow:0 1px 6px rgba(30,20,18,.05);border:1px solid var(--bdr);display:flex;gap:12px;align-items:flex-start}
.phnum{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.phn1{background:#FFF8E6;color:#A87820}
.phn2{background:var(--pl);color:var(--pd)}
.phn3{background:#FDECEA;color:#B85652}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.badge{background:var(--card2);border-radius:12px;padding:12px 8px;text-align:center;border:1px solid var(--bdr)}
.badge.earned{border-color:var(--pm);background:var(--pl)}
.badge-i{font-size:24px;margin-bottom:4px}
.badge-n{font-size:10px;font-weight:600;color:var(--t2);line-height:1.3}
.badge.earned .badge-n{color:var(--pd)}
.shop-tb{display:flex;gap:8px;margin-bottom:12px}
.sh-btn{flex:1;padding:10px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--card);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.sh-btn.rose{border-color:var(--pm);background:var(--pl);color:var(--pd)}
</style>
</head>
<body>
<div id="setup">
  <div class="s-logo">fitjourney 90</div>
  <div class="s-hero">🌸</div>
  <div class="s-title">Your 90-Day Journey</div>
  <div class="s-sub">Meals, workouts & wellness — all in one place.</div>
  <label class="s-label">Your name</label>
  <input class="s-input" id="inp-name" type="text" placeholder="e.g. Naveah" autocomplete="off">
  <label class="s-label">Starting weight (lbs)</label>
  <input class="s-input" id="inp-weight" type="number" placeholder="330" inputmode="decimal">
  <label class="s-label">Goal weight (lbs)</label>
  <input class="s-input" id="inp-goal" type="number" placeholder="210" inputmode="decimal">
  <label class="s-label">Start date</label>
  <input class="s-input" id="inp-start" type="date">
  <button class="cta" onclick="startApp()">Start my journey →</button>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-brand">fitjourney 90</div>
    <div class="hdr-row">
      <div class="hdr-name" id="hdr-name">welcome back ✦</div>
      <div class="day-pill" id="hdr-day">day 1</div>
    </div>
    <div class="ph-row">
      <div class="ph-chip ph1" id="hdr-phase">phase 1 · foundation</div>
      <div class="hd" id="hdr-date"></div>
    </div>
    <div class="pb-labels"><span id="pl1">0%</span><span id="pl2">90 days left</span></div>
    <div class="pb"><div class="pbf" id="pbf" style="width:0%"></div></div>
  </div>
  <div class="pages">
    <div class="page active" id="page-today"><div id="c-today"></div></div>
    <div class="page" id="page-meals"><div id="c-meals"></div></div>
    <div class="page" id="page-workout"><div id="c-workout"></div></div>
    <div class="page" id="page-wellness"><div id="c-wellness"></div></div>
    <div class="page" id="page-progress"><div id="c-progress"></div></div>
  </div>

const WKR=['upper','core','recovery','lower','circuit','cardio','rest'];

// ── STATE ─────────────────────────────────────────────
let S={name:'',startDate:'',sw:330,gw:210,wlog:[],meals:{},ex:{},water:{},tracker:{},mood:{},viewDay:1,mv:'plan'};
const save=()=>localStorage.setItem('fj90_v5',JSON.stringify(S));
function load(){const r=localStorage.getItem('fj90_v5');if(r){S=JSON.parse(r);return true;}return false;}
const td=()=>new Date().toISOString().slice(0,10);
function curDay(){if(!S.startDate)return 1;return Math.max(1,Math.min(90,Math.floor((new Date(td())-new Date(S.startDate))/864e5)+1));}
function getMeals(d){const i=(d-1)%7;return{breakfast:B[i],snack1:SA[i],lunch:L[(i+2)%7],snack2:SB[(i+4)%7],dinner:D[(i+1)%7]};}
function getWk(d){const ph=d<=30?1:d<=60?2:3;return WK[`p${ph}_${WKR[(d-1)%7]}`];}
function calTgt(d){return d<=30?1900:d<=60?1750:1650;}
function eaten(d){const m=getMeals(d);return['breakfast','snack1','lunch','snack2','dinner'].reduce((s,k)=>S.meals[`${d}_${k}`]?s+m[k].cal:s,0);}

// ── SETUP ─────────────────────────────────────────────
function startApp(){
  const name=(document.getElementById('inp-name').value.trim())||'friend';
  const sw=parseFloat(document.getElementById('inp-weight').value)||330;
  const gw=parseFloat(document.getElementById('inp-goal').value)||210;
  const start=document.getElementById('inp-start').value||td();
  S={...S,name,startDate:start,sw,gw,wlog:[{date:start,weight:sw}]};
  save();launch();
}
function launch(){
  document.getElementById('setup').style.display='none';
  document.getElementById('app').style.display='flex';
  S.viewDay=curDay();
  updateHdr();rToday();rMeals();rWorkout();rWellness();rProgress();
}
function updateHdr(){
  const d=curDay(),pct=Math.round((d/90)*100),ph=d<=30?1:d<=60?2:3;
  document.getElementById('hdr-name').textContent=`hi, ${S.name.toLowerCase()} ✦`;
  document.getElementById('hdr-day').textContent=`day ${d}`;
  const pe=document.getElementById('hdr-phase');
  pe.textContent=`phase ${ph} · ${['foundation','build','accelerate'][ph-1]}`;
  pe.className=`ph-chip ph${ph}`;
  document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}).toLowerCase();
  document.getElementById('pbf').style.width=pct+'%';
  document.getElementById('pl1').textContent=pct+'% complete';
  document.getElementById('pl2').textContent=d>=90?'final day ✦':`${90-d} days left`;
}

// ── TODAY ─────────────────────────────────────────────
function rToday(){
  const d=curDay(),m=getMeals(d),w=getWk(d);
  const e=eaten(d),tgt=calTgt(d),fill=Math.min(100,(e/tgt)*100);
  const ts=td(),wc=S.water[ts]||0;
  const oz=wc*16,galPct=Math.min(100,(oz/128)*100);
  const todayMood=S.mood[ts]||0;
  const moods=[['😔','rough'],['😕','meh'],['😐','okay'],['🙂','good'],['😊','great']];
  document.getElementById('c-today').innerHTML=`
  <div class="affirm">
    <div class="affirm-q">today's affirmation</div>
    <div class="affirm-t">"${AFFS[(d-1)%AFFS.length]}"</div>
  </div>
  <div class="tip"><div class="tiphd">day ${d} tip</div><div class="tipb">${TIPS[(d-1)%TIPS.length]}</div></div>
  <div class="card">
    <div class="chd">how are you feeling today?</div>
    <div class="mood-row">${moods.map(([em,la],i)=>`<button class="mood-btn${todayMood===i+1?' sel':''}" onclick="setMood(${i+1})"><span class="mej">${em}</span><span class="mla">${la}</span></button>`).join('')}</div>
  </div>
  <div class="card">
    <div class="chd">calories</div>
    <div class="cbig">${e} <span style="font-size:15px;font-weight:400;color:var(--t2)">of ${tgt}</span></div>
    <div class="csub">${tgt-e>0?`${tgt-e} remaining`:'at your goal!'}</div>
    <div class="cbar"><div class="cbf${e>tgt?' over':''}" style="width:${fill}%"></div></div>
  </div>
  <div class="card">
    <div class="chd">today's meals — tap to check off</div>
    ${mRow(d,'breakfast',m.breakfast,'Breakfast')}
    ${mRow(d,'snack1',m.snack1,'Morning snack')}
    ${mRow(d,'lunch',m.lunch,'Lunch')}
    ${mRow(d,'snack2',m.snack2,'Afternoon snack')}
    ${mRow(d,'dinner',m.dinner,'Dinner')}
  </div>
  <div class="card">
    <div class="chd">today's workout</div>
    ${w.isRest?`<div class="rcard"><div class="rcircle">✦</div><div style="font-size:18px;font-weight:700;margin-bottom:6px">rest day</div><div style="font-size:13px;color:var(--t2);line-height:1.6">${w.tip}</div></div>`:`
    <div style="margin-bottom:12px"><div style="font-size:16px;font-weight:700;margin-bottom:7px;letter-spacing:-.01em">${w.n}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="wtag wtype">${w.type}</span><span class="wtag wdur">⏱ ${w.dur}</span>${w.cardio?`<span class="wtag wcrd">+ ${w.cardio}</span>`:''}</div></div>
    <button class="cta" style="padding:13px;font-size:14px" onclick="showTab('workout',document.querySelector('.nb:nth-child(3)'))">view workout →</button>`}
  </div>
  <div class="card">
    <div class="chd">💧 water — goal: 1 gallon (128 oz)</div>
    <div class="gal-wrap">
      <div class="gal-bar"><div class="gal-fill" style="width:${galPct}%"></div><div class="gal-label">${oz} oz / 128 oz${galPct>=100?' · 1 gallon! 🎉':''}</div></div>
      <div class="gal-cups">${Array.from({length:8},(_,i)=>`<button class="gcup${i<wc?' full':''}" onclick="tapWater(${i})">💧</button>`).join('')}</div>
      <div style="font-size:11px;color:var(--t3);margin-top:6px">each drop = 16 oz · 8 drops = 1 gallon</div>
    </div>
  </div>
  <div class="card">
    <div class="chd">log today's weight</div>
    <div class="wr"><input class="wi" type="number" id="tw" placeholder="${S.wlog.length?S.wlog[S.wlog.length-1].weight:S.sw}" inputmode="decimal" step="0.1"><button class="wb" onclick="logW('tw')">save</button></div>
    ${S.wlog.length?`<div style="font-size:12px;color:var(--t2)">last: <b style="color:var(--text)">${S.wlog[S.wlog.length-1].weight} lbs</b> on ${S.wlog[S.wlog.length-1].date}</div>`:''}
  </div>`;
}

function mRow(d,key,meal,label){
  const done=S.meals[`${d}_${key}`];
  return`<div class="mr${done?' done':''}" onclick="togMeal(${d},'${key}')">
    <div class="mc">${done?'✓':''}</div>
    <div class="mb">
      <div class="mt">${label}</div>
      <div class="mn">${meal.e} ${meal.name}</div>
      <div class="md">${meal.desc}</div>
      <div class="macros"><div class="mac">P <b>${meal.p}g</b></div><div class="mac">C <b>${meal.c}g</b></div><div class="mac">F <b>${meal.f}g</b></div></div>
    </div>
    <div class="mright"><div class="mcal">${meal.cal}</div><div class="mcall">cal</div></div>
  </div>`;
}
function togMeal(d,key){S.meals[`${d}_${key}`]=!S.meals[`${d}_${key}`];save();rToday();rMeals();rProgress();if(S.meals[`${d}_${key}`])notif('meal checked ✓');}
function setMood(v){S.mood[td()]=v;save();rToday();notif(['','rough day — you still showed up 💙','it gets better ✦','you\'re doing okay ✦','good day! keep going 🌸','great energy! 🌸'][v]);}
function tapWater(i){const ts=td(),c=S.water[ts]||0;S.water[ts]=i<c?i:i+1;save();rToday();if(S.water[ts]>=8)notif('1 gallon achieved! 💧');}
function logW(id){const v=parseFloat(document.getElementById(id).value);if(!v||v<50||v>700)return;const date=td();S.wlog=S.wlog.filter(e=>e.date!==date);S.wlog.push({date,weight:v});S.wlog.sort((a,b)=>a.date.localeCompare(b.date));save();rToday();rProgress();notif(`${v} lbs saved ✓`);}

// ── MEALS ─────────────────────────────────────────────
function rMeals(){
  const d=S.viewDay,m=getMeals(d),tgt=calTgt(d);
  const tot={cal:0,p:0,c:0,f:0};
  ['breakfast','snack1','lunch','snack2','dinner'].forEach(k=>{tot.cal+=m[k].cal;tot.p+=m[k].p;tot.c+=m[k].c;tot.f+=m[k].f;});
  const planHTML=`
  <div class="card" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div class="chd">day ${d} totals</div><div style="font-size:26px;font-weight:700;letter-spacing:-.03em">${tot.cal} <span style="font-size:13px;font-weight:400;color:var(--t2)">cal</span></div></div>
      <div style="display:flex;gap:12px;padding-top:4px">
        <div style="text-align:right"><div style="font-size:15px;font-weight:700;color:var(--pd)">${tot.p}g</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em">protein</div></div>
        <div style="text-align:right"><div style="font-size:15px;font-weight:700">${tot.c}g</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em">carbs</div></div>
        <div style="text-align:right"><div style="font-size:15px;font-weight:700;color:var(--amber)">${tot.f}g</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em">fat</div></div>
      </div>
    </div>
  </div>
  <div class="card">${['breakfast','snack1','lunch','snack2','dinner'].map((k,i)=>{
    const labels=['Breakfast','Morning snack','Lunch','Afternoon snack','Dinner'];
    const meal=m[k],done=S.meals[`${d}_${k}`];
    const rid=`rec-${d}-${k}`;
    return`<div class="mr${done?' done':''}" style="flex-wrap:wrap" onclick="">
      <div class="mc" onclick="togMeal(${d},'${k}');rMeals()" style="margin-top:4px">${done?'✓':''}</div>
      <div class="mb" onclick="togMeal(${d},'${k}');rMeals()">
        <div class="mt">${labels[i]}</div>
        <div class="mn">${meal.e} ${meal.name}</div>
        <div class="md" style="margin:3px 0">${meal.desc}</div>
        <div class="macros"><div class="mac">P <b>${meal.p}g</b></div><div class="mac">C <b>${meal.c}g</b></div><div class="mac">F <b>${meal.f}g</b></div></div>
        ${meal.recipe?`<button class="recipe-btn" onclick="event.stopPropagation();toggleRecipe('${rid}')">view recipe ▾</button>
        <div class="recipe-box" id="${rid}"><ol>${meal.recipe.map(s=>`<li>${s}</li>`).join('')}</ol></div>`:'' }
      </div>
      <div class="mright" style="padding-top:4px" onclick="togMeal(${d},'${k}');rMeals()"><div class="mcal">${meal.cal}</div><div class="mcall">cal</div></div>
    </div>`;
  }).join('')}</div>`;

  document.getElementById('c-meals').innerHTML=`
  <div class="dnav">
    <button class="dnb" onclick="changeDay(-1)">‹</button>
    <div style="text-align:center"><div style="font-size:17px;font-weight:700;letter-spacing:-.02em">day ${d}</div><div style="font-size:12px;color:var(--t2)">phase ${d<=30?1:d<=60?2:3} · ${tgt} cal target</div></div>
    <button class="dnb" onclick="changeDay(1)">›</button>
  </div>
  <div class="vtog">
    <button class="vtb${S.mv==='plan'?' active':''}" onclick="setMv('plan')">meal plan</button>
    <button class="vtb${S.mv==='tracker'?' active':''}" onclick="setMv('tracker')">calorie tracker</button>
  </div>
  <div id="mv-plan" style="display:${S.mv==='plan'?'block':'none'}">${planHTML}</div>
  <div id="mv-tracker" style="display:${S.mv==='tracker'?'block':'none'}"><div id="tracker-view"></div></div>`;
  if(S.mv==='tracker')rTracker();
}

function toggleRecipe(id){const el=document.getElementById(id);if(el){const open=el.style.display==='block';el.style.display=open?'none':'block';const btn=el.previousElementSibling;if(btn)btn.textContent=open?'view recipe ▾':'hide recipe ▴';}}
function changeDay(delta){S.viewDay=Math.max(1,Math.min(90,S.viewDay+delta));rMeals();rWorkout();}
function setMv(v){S.mv=v;rMeals();}

// ── CALORIE TRACKER ───────────────────────────────────
let _catItems=[];
function rTracker(){
  const date=td(),items=S.tracker[date]||[];
  const total=items.reduce((s,i)=>s+i.cal,0);
  const goal=calTgt(curDay());
  const pct=Math.min(100,Math.round((total/goal)*100));
  const tp=items.reduce((s,i)=>s+i.p,0),tc=items.reduce((s,i)=>s+i.c,0),tf=items.reduce((s,i)=>s+i.f,0);
  document.getElementById('tracker-view').innerHTML=`
  <div class="card">
    <div class="chd">today · ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
    <div style="font-size:32px;font-weight:800;letter-spacing:-.03em;margin-bottom:2px">${total} <span style="font-size:15px;font-weight:400;color:var(--t2)">of ${goal} cal</span></div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:10px">${total<=goal?`${goal-total} remaining`:`${total-goal} over goal`}</div>
    <div class="cbar"><div class="cbf${total>goal?' over':''}" style="width:${pct}%"></div></div>
    ${items.length?`<div style="display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)">
      <div style="flex:1;text-align:center"><div style="font-size:15px;font-weight:700;color:var(--pd)">${tp}g</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em">protein</div></div>
      <div style="flex:1;text-align:center"><div style="font-size:15px;font-weight:700">${tc}g</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em">carbs</div></div>
      <div style="flex:1;text-align:center"><div style="font-size:15px;font-weight:700;color:var(--amber)">${tf}g</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em">fat</div></div>
    </div>`:''}
  </div>
  ${items.length?`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="chd" style="margin:0">today's log</div>
      <div style="font-size:11px;color:var(--t2)">${items.length} item${items.length>1?'s':''}</div>
    </div>
    ${items.map(i=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)">
      <div style="font-size:20px;width:28px;text-align:center">${i.e}</div>
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i.name}</div>
      <div style="font-size:11px;color:var(--t2)">${i.p}g P · ${i.c}g C · ${i.f}g F</div></div>
      <div style="font-size:15px;font-weight:700;min-width:38px;text-align:right">${i.cal}</div>
      <button onclick="removeFromTracker(${i.uid})" style="background:none;border:none;color:var(--t3);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;font-family:inherit">×</button>
    </div>`).join('')}
  </div>`:`<div style="text-align:center;padding:32px 16px">
    <div style="font-size:44px;margin-bottom:12px">🍽️</div>
    <div style="font-size:16px;font-weight:600;margin-bottom:6px">nothing logged yet</div>
    <div style="font-size:13px;color:var(--t2)">tap below to add from the catalog</div>
  </div>`}
  <button class="cta" onclick="openCatalog('')" style="padding:14px;font-size:15px">+ Add food from catalog</button>`;
}
function addToTracker(idx){
  const item=_catItems[idx];if(!item)return;
  const date=td();if(!S.tracker[date])S.tracker[date]=[];
  S.tracker[date].push({uid:Date.now()+Math.random(),name:item.name,e:item.e,cal:item.cal,p:item.p,c:item.c,f:item.f});
  save();rTracker();
  notif(`${item.name.slice(0,24)} added ✓`);
}
function removeFromTracker(uid){
  const date=td();S.tracker[date]=(S.tracker[date]||[]).filter(i=>i.uid!==uid);save();rTracker();notif('removed');
}
function openCatalog(q){
  q=(q||'').toLowerCase();
  _catItems=q?CATALOG.filter(i=>i.name.toLowerCase().includes(q)||i.cat.toLowerCase().includes(q)):[...CATALOG];
  const groups={};
  _catItems.forEach((item,idx)=>{if(!groups[item.cat])groups[item.cat]=[];groups[item.cat].push({...item,_idx:idx});});
  document.getElementById('cat-body').innerHTML=`
    <input id="cat-search" placeholder="🔍  search any food..." oninput="openCatalog(this.value)" value="${q.replace(/"/g,'&quot;')}"
      style="width:100%;background:var(--card2);border:1.5px solid var(--bdr);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;font-family:inherit;margin-bottom:14px;-webkit-appearance:none">
    ${Object.entries(groups).map(([cat,items])=>`
      <div style="margin-bottom:16px">
        <div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">${cat}</div>
        ${items.map(item=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)">
          <div style="font-size:20px;width:28px;text-align:center">${item.e}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name}</div>

function setBType(t){

function toggleBreath(){if(bTimer)stopBreath();else startBreath();}
function startBreath(){bPhaseI=0;runBreathPhase();}
function runBreathPhase(){
  const phases=BREATH_TYPES[bType].phases;
  const ph=phases[bPhaseI%phases.length];
  bCountdown=ph.c;
  const orb=document.getElementById('borb');
  const phEl=document.getElementById('bph');
  const cEl=document.getElementById('bcnt');
  if(!orb)return;
  orb.className='breath-orb '+ph.cls;
  phEl.textContent=ph.n;
  cEl.textContent=bCountdown;
  bTimer=setInterval(()=>{
    bCountdown--;
    if(cEl)cEl.textContent=Math.max(0,bCountdown);
    if(bCountdown<=0){
      clearInterval(bTimer);bTimer=null;
      bPhaseI++;
      runBreathPhase();
    }
  },1000);
}
function stopBreath(){
  if(bTimer){clearInterval(bTimer);bTimer=null;}
  const orb=document.getElementById('borb');
  if(orb){orb.className='breath-orb';document.getElementById('bph').textContent='tap to begin';document.getElementById('bcnt').textContent='';}
}

  </div>
  <div class="card"><div class="chd">log weight</div><div class="wr"><input class="wi" type="number" id="pw" placeholder="${latest}" inputmode="decimal" step="0.1"><button class="wb" onclick="logW('pw')">save</button></div></div>
  ${logs.length?`<div class="card"><div class="chd">weight history</div>${[...logs].reverse().slice(0,10).map((e,i,arr)=>{const prev=arr[i+1];const delta=prev?+(e.weight-prev.weight).toFixed(1):0;return`<div class="wlr"><span style="color:var(--t2)">${e.date}</span><div style="display:flex;align-items:center;gap:10px">${delta!==0?`<span class="${delta<0?'down':'up'}">${delta<0?'↓':'↑'} ${Math.abs(delta)}</span>`:`<span style="color:var(--t3)">start</span>`}<span class="wlw">${e.weight}</span></div></div>`;}).join('')}</div>`:''}
  <div class="card"><div class="chd">achievements</div><div class="badge-grid">${badges.map(b=>`<div class="badge${b.e?' earned':''}"><div class="badge-i" style="${b.e?'':'filter:grayscale(1) opacity(.3)'}">${b.i}</div><div class="badge-n">${b.n}</div></div>`).join('')}</div></div>
  <div class="card"><div class="chd">90-day phases</div>
    <div class="ph-card"><div class="phnum phn1">01</div><div><div style="font-size:14px;font-weight:700;margin-bottom:3px">Foundation · Days 1–30</div><div style="font-size:12px;color:var(--t2);line-height:1.4">~1,900 cal/day · Bodyweight + walks · Build the habit</div></div></div>
    <div class="ph-card"><div class="phnum phn2">02</div><div><div style="font-size:14px;font-weight:700;margin-bottom:3px">Build · Days 31–60</div><div style="font-size:12px;color:var(--t2);line-height:1.4">~1,750 cal/day · Gym strength + cardio intervals</div></div></div>
    <div class="ph-card"><div class="phnum phn3">03</div><div><div style="font-size:14px;font-weight:700;margin-bottom:3px">Accelerate · Days 61–90</div><div style="font-size:12px;color:var(--t2);line-height:1.4">~1,650 cal/day · HIIT + heavy lifting + peak cardio</div></div></div>
  </div>
  <div class="card"><div class="chd">90-day calendar · tap any day</div>
    <div class="cal-grid" style="margin-bottom:4px">${['m','t','w','t','f','s','s'].map(h=>`<div class="cal-dh">${h}</div>`).join('')}
    ${Array.from({length:90},(_,i)=>{const dd=i+1,done=!getWk(dd).isRest&&S.ex[`${dd}_done`];const cls='cal-d '+(dd===d?'td':done?'done-d':dd>d?'fut-d':'miss-d');return`<div class="${cls}" onclick="openModal(${dd})">${dd}</div>`;}).join('')}</div>
  </div>
  <div class="inst"><h3>📱 install on your phone</h3><p><b>iPhone:</b> Safari → Share → "Add to Home Screen"<br><b>Android:</b> Chrome → ⋮ → "Add to Home Screen"</p></div>`;
  if(logs.length>=2)setTimeout(()=>{const c=document.getElementById('wtc');if(c)drawChart(c,logs);},80);
}

function drawChart(canvas,logs){
  const dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=170*dpr;canvas.style.height='170px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const W=rect.width,H=170,pl=42,pr=12,pt=12,pb=24,cw=W-pl-pr,ch=H-pt-pb;
  const ws=logs.map(l=>l.weight),goal=S.gw;
  const maxW=Math.max(...ws)+8,minW=Math.min(...ws,goal)-8;
  const xp=i=>pl+(i/(Math.max(logs.length-1,1)))*cw,yp=w=>pt+ch-((w-minW)/(maxW-minW))*ch;
  const gy=yp(goal);ctx.setLineDash([5,4]);ctx.strokeStyle='rgba(121,184,154,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pl,gy);ctx.lineTo(pl+cw,gy);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(61,139,110,.7)';ctx.font='bold 10px sans-serif';ctx.textAlign='right';ctx.fillText('goal',pl-4,gy+4);
  const grad=ctx.createLinearGradient(0,pt,0,H);grad.addColorStop(0,'rgba(245,184,181,.25)');grad.addColorStop(1,'rgba(245,184,181,0)');
  ctx.beginPath();ctx.moveTo(xp(0),H);logs.forEach((l,i)=>ctx.lineTo(xp(i),yp(l.weight)));ctx.lineTo(xp(logs.length-1),H);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.strokeStyle='#F5B8B5';ctx.lineWidth=2.5;ctx.lineJoin='round';logs.forEach((l,i)=>i===0?ctx.moveTo(xp(i),yp(l.weight)):ctx.lineTo(xp(i),yp(l.weight)));ctx.stroke();
  logs.forEach((l,i)=>{ctx.beginPath();ctx.arc(xp(i),yp(l.weight),3.5,0,Math.PI*2);ctx.fillStyle='#F5B8B5';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();});
  ctx.fillStyle='rgba(30,23,23,.28)';ctx.font='10px sans-serif';ctx.textAlign='right';
  for(let i=0;i<=3;i++){const w=minW+((maxW-minW)*i/3);ctx.fillText(Math.round(w),pl-4,yp(w)+4);}
}

// ── MODAL ─────────────────────────────────────────────
function openModal(d){
  const m=getMeals(d),w=getWk(d),today=curDay();
  document.getElementById('modal-body').innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
    <div><div style="font-size:22px;font-weight:700;letter-spacing:-.03em">day ${d}</div><div style="font-size:12px;color:var(--t2)">phase ${d<=30?1:d<=60?2:3} · ${calTgt(d)} cal · ${['mon','tue','wed','thu','fri','sat','sun'][(d-1)%7]}</div></div>
    <span style="font-size:11px;font-weight:600;padding:4px 11px;border-radius:100px;background:${d===today?'var(--pl)':'var(--card2)'};color:${d===today?'var(--pd)':'var(--t2)'};border:1px solid ${d===today?'var(--pm)':'var(--bdr)'}">${d<today?'past':d===today?'today':'upcoming'}</span>
  </div>
  <div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px">meals</div>
  ${[['Breakfast',m.breakfast],['Lunch',m.lunch],['Dinner',m.dinner]].map(([l,ml])=>`<div style="display:flex;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bdr)"><div style="font-size:20px">${ml.e}</div><div><div style="font-size:11px;color:var(--t3)">${l}</div><div style="font-size:14px;font-weight:600">${ml.name}</div><div style="font-size:12px;color:var(--t2)">${ml.cal} cal · ${ml.p}g protein</div></div></div>`).join('')}
  <div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin:12px 0 8px">workout</div>
  ${w.isRest?`<div style="text-align:center;padding:12px;color:var(--t2)">✦ rest & recovery day</div>`:`<div style="background:var(--pl);border:1px solid var(--pm);border-radius:12px;padding:13px"><div style="font-size:14px;font-weight:700;margin-bottom:5px">${w.n}</div><div style="font-size:12px;color:var(--t2)">${w.type} · ${w.dur}${w.cardio?' · +'+w.cardio:''}</div></div>`}
  <button class="cta" style="margin-top:16px;padding:13px;font-size:14px" onclick="goDay(${d})">view full day →</button>`;
  document.getElementById('day-modal').classList.add('open');
}
function goDay(d){S.viewDay=d;closeModal(true);rMeals();rWorkout();showTab('meals',document.querySelector('.nb:nth-child(2)'));}
function closeModal(f){if(f===true||f.target===document.getElementById('day-modal'))document.getElementById('day-modal').classList.remove('open');}

// ── UI ────────────────────────────────────────────────
function showTab(name,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));document.getElementById('page-'+name).classList.add('active');if(btn)btn.classList.add('active');}
function notif(msg){const el=document.getElementById('notif');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}

// ── BOOT ──────────────────────────────────────────────
(function(){
  const inp=document.getElementById('inp-start');if(inp)inp.value=new Date().toISOString().slice(0,10);
  if(load()&&S.startDate)launch();
  else document.getElementById('setup').style.display='flex';
})();
</script>
